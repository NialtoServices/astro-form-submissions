<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact, in a drawer</title>
    <script type="module">
      import { initializeForms } from '/client/form.js'

      initializeForms()

      // A drawer that re-parents its content when it opens, as many drawer and dialog scripts do.
      document.querySelector('#open-drawer').addEventListener('click', () => {
        const drawerElement = document.querySelector('#drawer')
        drawerElement.append(document.querySelector('form[data-astro-form]'))
        drawerElement.hidden = false
      })
    </script>
  </head>
  <body>
    <main>
      <h1>Contact us</h1>

      <button type="button" id="open-drawer">Open the drawer</button>

      <form data-astro-form action="/api/contact" method="POST" novalidate>
        <input type="text" name="website" tabindex="-1" autocomplete="off" hidden />

        <label>Name <input name="name" /></label>

        <label>Email <input id="drawer-email" name="email" type="email" /></label>
        <p data-astro-form-field-error-for="email" id="drawer-email-error" hidden></p>

        <label>Message <textarea name="message"></textarea></label>

        <button type="submit">Send</button>

        <p
          data-astro-form-status
          data-astro-form-message-sending="Sending…"
          data-astro-form-message-success="Thanks, we'll be in touch."
          data-astro-form-message-generic-error="Something went wrong."></p>
      </form>
    </main>

    <aside id="drawer" aria-label="Drawer" hidden></aside>
  </body>
</html>
