<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Turnstile</title>
    <script type="module">
      import { initializeForms } from '/client/form.js'

      initializeForms()
    </script>
    <script src="/turnstile-fake.js"></script>
  </head>
  <body>
    <main>
      <h1>Turnstile</h1>

      <form id="interaction-only" data-astro-form action="/api/contact" method="POST" novalidate>
        <label>Name <input name="name" /></label>
        <div class="cf-turnstile" data-appearance="interaction-only"></div>
        <button type="submit">Send</button>
        <p data-astro-form-status></p>
      </form>

      <form id="always-shown" data-astro-form action="/api/contact" method="POST" novalidate>
        <label>Email <input name="email" type="email" /></label>
        <div class="cf-turnstile"></div>
        <button type="submit">Send again</button>
        <p data-astro-form-status></p>
      </form>

      <form id="no-widget" data-astro-form action="/api/contact" method="POST" novalidate>
        <label>Message <input name="message" /></label>
        <button type="submit">Send a third</button>
        <p data-astro-form-status></p>
      </form>
    </main>
  </body>
</html>
