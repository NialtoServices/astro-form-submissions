<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact</title>
    <script type="module">
      import { initializeForms } from '/client/form.js'

      initializeForms()
    </script>
  </head>
  <body>
    <main>
      <h1>Contact us</h1>

      <!-- novalidate leaves validation to the route, so its field errors are what the person sees. -->
      <form data-astro-form action="/api/contact" method="POST" novalidate>
        <input type="text" name="website" tabindex="-1" autocomplete="off" hidden />

        <label>Name <input id="contact-name" name="name" /></label>

        <label>Email <input id="contact-email" name="email" type="email" /></label>
        <p data-astro-form-field-error-for="email" id="contact-email-error" hidden></p>

        <label>Message <textarea id="contact-message" name="message"></textarea></label>
        <p data-astro-form-field-error-for="message" id="contact-message-error" hidden></p>

        <button type="submit">Send</button>

        <p
          data-astro-form-status
          data-astro-form-message-sending="Sending…"
          data-astro-form-message-success="Thanks, we'll be in touch."
          data-astro-form-message-generic-error="Something went wrong."
          data-astro-form-message-network-error="Could not reach the server. Please try again."></p>
      </form>
      <div data-astro-form-success role="status" hidden>
        <h2>Thanks, we'll be in touch.</h2>
      </div>
    </main>
  </body>
</html>
