<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enquiry, sections that come and go</title>
    <script type="module">
      import { initializeForms } from '/client/form.js'

      initializeForms()
    </script>
    <script>
      // Hiding alone leaves a field in the submission; disabling it as well is what keeps it out.
      document.addEventListener('DOMContentLoaded', () => {
        const enquiryElement = document.querySelector('#enquiry')
        const sectionElements = document.querySelectorAll('[data-section]')

        const showSectionForEnquiry = () => {
          for (const sectionElement of sectionElements) {
            const applies = sectionElement.dataset.section === enquiryElement.value
            sectionElement.hidden = !applies
            sectionElement.disabled = !applies
          }
        }

        enquiryElement.addEventListener('change', showSectionForEnquiry)
        showSectionForEnquiry()
      })
    </script>
  </head>
  <body>
    <main>
      <h1>Make an enquiry</h1>

      <form data-astro-form action="/api/conditional" method="POST" novalidate>
        <label>Name <input name="name" /></label>

        <label>
          Enquiry type
          <select id="enquiry" name="enquiry">
            <option value="general">General question</option>
            <option value="quote">Quote request</option>
          </select>
        </label>

        <fieldset data-section="general">
          <legend>Your question</legend>
          <label>Topic <input name="topic" /></label>
        </fieldset>

        <fieldset data-section="quote">
          <legend>Your quote</legend>
          <label>Budget <input name="budget" /></label>
          <p data-astro-form-field-error-for="budget" id="quote-budget-error" hidden></p>
        </fieldset>

        <p hidden><input name="reference" value="REF-1042" /></p>

        <button type="submit">Send</button>

        <p
          data-astro-form-status
          data-astro-form-message-sending="Sending…"
          data-astro-form-message-success="Thanks, we'll be in touch."
          data-astro-form-message-generic-error="Something went wrong."></p>
      </form>
    </main>
  </body>
</html>
