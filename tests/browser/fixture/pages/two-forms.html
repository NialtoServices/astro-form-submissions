<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Two forms with a CV field</title>
    <script type="module">
      import { initializeForms } from '/client/form.js'

      initializeForms()
    </script>
  </head>
  <body>
    <main>
      <section aria-labelledby="application-heading">
        <h2 id="application-heading">Apply for the role</h2>

        <form data-astro-form action="/api/application" method="POST" enctype="multipart/form-data" novalidate>
          <label>Your name <input name="name" /></label>

          <label for="application-cv">Your CV</label>
          <input
            id="application-cv"
            type="file"
            name="cv"
            accept="application/pdf,text/plain,.pdf,.txt,.md"
            multiple
            data-astro-form-max-files="3"
            data-astro-form-max-file-bytes="65536"
            data-astro-form-max-total-bytes="131072" />
          <ul data-astro-form-file-list-for="cv" aria-label="Your chosen files">
            <template>
              <li><span data-astro-form-file-name></span></li>
            </template>
          </ul>

          <button type="submit">Send application</button>

          <p data-astro-form-status data-astro-form-message-success="Thanks, we'll be in touch."></p>
        </form>
      </section>

      <section aria-labelledby="referral-heading">
        <h2 id="referral-heading">Refer a friend</h2>

        <form data-astro-form action="/api/application" method="POST" enctype="multipart/form-data" novalidate>
          <label>Friend’s name <input name="name" /></label>

          <label for="referral-cv">Friend’s CV</label>
          <input
            id="referral-cv"
            type="file"
            name="cv"
            accept="application/pdf,text/plain,.pdf,.txt,.md"
            multiple
            data-astro-form-max-files="3"
            data-astro-form-max-file-bytes="65536"
            data-astro-form-max-total-bytes="131072" />
          <ul data-astro-form-file-list-for="cv" aria-label="Friend’s chosen files">
            <template>
              <li><span data-astro-form-file-name></span></li>
            </template>
          </ul>

          <button type="submit">Send referral</button>

          <p data-astro-form-status data-astro-form-message-success="Thanks, we'll be in touch."></p>
        </form>
      </section>
    </main>
  </body>
</html>
